name: DOCKER

on:
  push:
    branches:
      - 'master'
    paths:
      - 'etc/Dockerfile'
      - 'server/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read

# Serialize publishes to `latest` so two pushes to master cannot race.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: zevlg/telega-server

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push (linux/amd64)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: etc/Dockerfile
          platforms: linux/amd64
          push: true
          # Digest-only pushes would let Docker Hub garbage collect the blobs,
          # so keep a per-arch tag around.
          tags: ${{ env.IMAGE }}:latest-amd64
          provenance: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0-or-later
          annotations: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  build-arm64:
    # Native arm64 runner, see https://t.me/emacs_telega/47280
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push (linux/arm64/v8)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: etc/Dockerfile
          platforms: linux/arm64/v8
          push: true
          tags: ${{ env.IMAGE }}:latest-arm64
          provenance: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0-or-later
          annotations: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  publish:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Create multi-arch manifest
        env:
          AMD64_DIGEST: ${{ needs.build-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build-arm64.outputs.digest }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:sha-${SHA:0:7}" \
            "${IMAGE}@${AMD64_DIGEST}" \
            "${IMAGE}@${ARM64_DIGEST}"
